# Step 3. Three replicas of v1 with readiness and liveness probes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fare-api
  labels: {app: fare-api, company: queen-city-trip-analytics}
spec:
  replicas: 3
  selector: {matchLabels: {app: fare-api}}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: fare-api}
    spec:
      containers:
      - name: fare-api
        image: IMAGE_BASE:v1
        ports: [{containerPort: 8080}]
        lifecycle:
          preStop:
            exec: {command: ["sleep", "10"]}
        resources:
          requests: {cpu: 100m, memory: 96Mi}
          limits: {cpu: "1", memory: 256Mi}
        readinessProbe:
          httpGet: {path: /ready, port: 8080}
          periodSeconds: 2
          failureThreshold: 2
        livenessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 60
