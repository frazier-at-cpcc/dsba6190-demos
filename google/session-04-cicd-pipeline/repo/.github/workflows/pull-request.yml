# Stages 1 to 3 of the pipeline. Runs on every pull request against main.
#
#   1. init, validate, fmt -check     syntax and style
#   2. plan, posted on the pull request    the review artifact
#   3. policy                          rules that reject without a human
#
# Nothing here can change infrastructure. The service account is the same
# one apply uses, so the plan is computed against real state, but no step
# runs apply.

name: pull-request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: terraform-state
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  CONFTEST_VERSION: "0.69.0"

jobs:
  plan:
    name: "stages 1 to 3 · validate, plan, policy"
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7.0.1

      - name: Authenticate to Google Cloud through Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.TF_SERVICE_ACCOUNT }}

      - name: Install Terraform 1.5.7
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: "Stage 1 · fmt"
        run: terraform fmt -check -recursive -diff

      - name: "Stage 1 · init"
        run: >
          terraform init -no-color
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="prefix=${{ vars.TF_STATE_PREFIX }}"

      - name: "Stage 1 · validate"
        run: terraform validate -no-color

      - name: "Stage 2 · plan"
        id: plan
        run: |
          set -o pipefail
          terraform plan -no-color -out=tfplan 2>&1 | tee plan.txt
          terraform show -json tfplan > tfplan.json

      - name: Install conftest
        run: |
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" | tar xz conftest
          sudo install conftest /usr/local/bin/conftest
          conftest --version

      - name: "Stage 3 · policy"
        id: policy
        continue-on-error: true
        run: |
          set -o pipefail
          conftest test tfplan.json --policy policy --no-color 2>&1 | tee policy.txt

      - name: Compose the pull-request comment
        if: always()
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
        run: |
          summary=$(grep -E '^(Plan:|No changes\.)' plan.txt | head -1 || true)
          case "$POLICY_OUTCOME" in
            success) verdict="passed" ;;
            failure) verdict="FAILED. This pull request cannot be merged until the plan satisfies policy." ;;
            *)       verdict="not run, because the plan did not complete" ;;
          esac
          {
            echo "## Terraform plan for \`${GITHUB_SHA::7}\`"
            echo
            echo "**Stage 2 · plan:** ${summary:-$PLAN_OUTCOME}"
            echo
            echo "**Stage 3 · policy:** ${verdict}"
            echo
            if [ -s policy.txt ]; then
              echo '```'
              cat policy.txt
              echo '```'
              echo
            fi
            echo '<details><summary>Full plan output</summary>'
            echo
            echo '```hcl'
            head -c 60000 plan.txt
            echo '```'
            echo
            echo '</details>'
            echo
            echo "_The plan is the code review. Approve the diff above, not the HCL._"
          } > comment.md

      - name: "Stage 2 · post the plan on the pull request"
        if: always()
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: terraform
          path: comment.md

      - name: Fail the check when policy failed
        if: steps.policy.outcome == 'failure'
        run: |
          echo "Policy rejected the plan. See the pull-request comment."
          exit 1
