# Stages 4 and 5 of the pipeline. Runs when a pull request merges to main.
#
#   4. manual approval                 the production environment gate
#   5. apply, by a service account     never a person's credentials
#
# Two jobs on purpose. The first computes and saves the plan for the merged
# commit and prints it in the job summary. The second waits for a reviewer,
# then applies exactly that saved plan. The reviewer approves a plan they can
# read, not a commit they have to imagine.

name: apply

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-state
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  CONFTEST_VERSION: "0.69.0"

jobs:
  plan:
    name: "plan the merged commit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.TF_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: init
        run: >
          terraform init -no-color
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="prefix=${{ vars.TF_STATE_PREFIX }}"

      - name: plan
        run: |
          set -o pipefail
          terraform plan -no-color -out=tfplan 2>&1 | tee plan.txt
          terraform show -json tfplan > tfplan.json

      - name: Install conftest
        run: |
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" | tar xz conftest
          sudo install conftest /usr/local/bin/conftest

      - name: policy, again
        run: conftest test tfplan.json --policy policy --no-color

      - name: Print the plan where the approver will read it
        run: |
          {
            echo "## Plan awaiting approval"
            echo
            echo '```hcl'
            head -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the plan for the apply job
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tfplan-${{ github.sha }}
          path: tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    name: "stage 4 gate, then stage 5 apply"
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.TF_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: init
        run: >
          terraform init -no-color
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="prefix=${{ vars.TF_STATE_PREFIX }}"

      - name: Fetch the approved plan
        uses: actions/download-artifact@v8.0.1
        with:
          name: tfplan-${{ github.sha }}

      - name: "Stage 5 · apply the saved plan"
        run: terraform apply -no-color tfplan
